# Production overlay for the Hetzner box (#13). ALWAYS layered over the base
# file — it adds the api and caddy services and takes the two databases off the
# host's network; on its own it is not a valid stack:
#
#   docker compose -f docker-compose.yml -f compose.prod.yml <cmd>
#
# Lives at /opt/taxi on the box next to docker-compose.yml, Caddyfile, certs/
# and the host .env (never committed — runbook docs/runbooks/hetzner-deploy.md
# lists every key). Compose reads that .env for the ${…} substitutions below
# AND hands the whole file to the api via env_file.
#
# The healthchecks come from the base file untouched — they were hard-won (the
# TCP-not-socket pg_isready comment there says why).

services:
  db:
    # Compose-network only. The base file publishes 5432 for local tooling; on
    # an internet-facing box that is Postgres on the public IP, behind the
    # `taxi:taxi` password. `!reset` clears the inherited list (compose ≥ 2.24).
    ports: !reset []
    environment:
      # Read by initdb on FIRST start only — a fresh volume. Changing it later
      # does not change the role's password; ALTER ROLE does (runbook §3).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the host .env}
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  api:
    image: ghcr.io/linardsb/taxi-api:${API_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      # Composed here rather than written twice: the password lives in ONE
      # place (POSTGRES_PASSWORD), and the hostnames are compose's own.
      # POSTGRES_PASSWORD is interpolated UNESCAPED, so it must be URL-safe —
      # hex only, as runbook §3 prescribes (`openssl rand -hex 16`), and the
      # `:?` guard below checks presence, not shape. Observed against this
      # tree's pg-connection-string 2.14.0, the parser `new Pool` uses:
      # `/`, `#` or `?` fail the parse at boot with `Invalid URL`. A `%`
      # followed by two hex digits is silently DECODED (`%41` becomes `A`),
      # so pg authenticates with a password nobody set and the boot fails on
      # auth with nothing naming the password's shape — the one to fear.
      # `@` and `:` happen to survive the parse; do not rely on it.
      DATABASE_URL: postgres://taxi:${POSTGRES_PASSWORD}@db:5432/taxi
      REDIS_URL: redis://redis:6379
      # Routes (#134). Set here, like the two above, so the host .env never
      # needs it; production refuses to boot without it.
      OSRM_URL: http://osrm:5000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Healthy means the graph is LOADED and answering a real route, so an
      # api never starts quoting against a routing server that is not there.
      # It also means `run --rm api …` builds the graph on a box that has
      # none — see osrm-prep.
      osrm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # `node -e` because the runtime image has no curl. `fetch` is global in
      # node 20; a non-2xx or a refused connection both exit 1.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Builds the OSRM routing graph for the Latvia OSM extract (#134), ONCE: a
  # one-shot that exits 0 in about a second when the graph is already in the
  # volume. On a box with none it downloads the extract from Geofabrik and
  # runs extract -> partition -> customize (MLD); runbook §5.5 has the
  # observed times and memory. It builds into /data/next and swaps it in only
  # after every step succeeded, so a failed download or build leaves the old
  # graph serving and no READY marker; `set -e` then fails the container,
  # `osrm` never starts, and neither does a new api.
  # `run --rm -e OSRM_REBUILD=1 osrm-prep` forces a fresh extract — the
  # refresh procedure, runbook §5.5.
  osrm-prep:
    image: &osrm-image ghcr.io/project-osrm/osrm-backend:v26.4.0
    volumes:
      - osrm-data:/data
    environment:
      OSRM_PBF_URL: https://download.geofabrik.de/europe/latvia-latest.osm.pbf
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        if [ -f /data/graph/READY ] && [ "$${OSRM_REBUILD:-0}" != 1 ]; then
          echo "osrm-prep: graph present, nothing to do"; exit 0
        fi
        rm -rf /data/next && mkdir -p /data/next && cd /data/next
        echo "osrm-prep: downloading $$OSRM_PBF_URL"
        wget -q -O latvia.osm.pbf "$$OSRM_PBF_URL"
        osrm-extract -p /opt/car.lua latvia.osm.pbf
        osrm-partition latvia.osrm
        osrm-customize latvia.osrm
        rm latvia.osm.pbf
        date -u +%Y-%m-%dT%H:%M:%SZ > READY
        rm -rf /data/graph && mv /data/next /data/graph
        echo "osrm-prep: graph built"
    restart: "no"

  # The routing server. Compose-network only, like db and redis: nothing but
  # the api reaches it. It loads the whole graph into memory at start, so a
  # rebuilt graph in the volume is served only after `restart osrm`.
  osrm:
    image: *osrm-image
    command: ["osrm-routed", "--algorithm", "mld", "/data/graph/latvia.osrm"]
    volumes:
      - osrm-data:/data:ro
    depends_on:
      osrm-prep:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # A real Rīga route (centre -> station), not a port probe: healthy means
      # the graph is loaded and routable. busybox wget exits 1 on a non-2xx.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:5000/route/v1/driving/24.1052,56.9496;24.1206,56.9236?overview=false",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The one placeholder the Caddyfile reads.
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in the host .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin CA cert + key (runbook §2). Read-only; Caddy never
      # writes them because it is not doing ACME for this site.
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    # No `condition: service_healthy`: Caddy should be up and answering 502
    # while the api restarts, not waiting for it — a 502 is a diagnosis, a
    # connection refused is not.
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  # The routing graph. Rebuilt from the internet by osrm-prep (runbook §5.5),
  # so NOT backed up — nothing precious.
  osrm-data:

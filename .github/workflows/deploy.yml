name: Deploy

# MANUAL ONLY, on purpose. Auto-deploy on merge to main is a decision for after
# the first successful manual run — an image auto-shipping to the box Atis is
# testing from, on the strength of a green CI that does not exercise a
# production boot, is worse than one click. Revisit once /health has answered
# a hand-triggered deploy at least once (#13).
#
# What one run does: build the api image for linux/amd64 (CX22 is x86), push it
# to ghcr.io tagged with the commit, then over SSH: pull, run the migrations
# with the NEW image, `up -d --wait`, prune. Migrations run BEFORE the new API
# starts, so code that needs a column never runs against a table without it.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   SSH_HOST         the box's public IPv4
#   SSH_KEY          private key for the `deploy` user (runbook §1.4)
#   SSH_KNOWN_HOSTS  output of `ssh-keyscan -H <SSH_HOST>` — pinned, so a
#                    changed host key fails the run instead of being trusted
#   GHCR_TOKEN       a classic PAT with read:packages, used ON THE BOX to pull
#                    the private image (the runner pushes with GITHUB_TOKEN)
on:
  workflow_dispatch:

# One deploy at a time; a second trigger queues rather than racing the first.
concurrency: deploy-hetzner

env:
  IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the deploy key and the pinned host key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Sync the compose files to the box
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        # The box's copies track the repo, so a change to the overlay or the
        # Caddyfile ships with the next deploy instead of drifting. The host
        # .env and certs/ are NOT in the repo and are never touched here.
        run: |
          scp -i ~/.ssh/deploy docker-compose.yml compose.prod.yml Caddyfile "deploy@$SSH_HOST:/opt/taxi/"
          scp -i ~/.ssh/deploy scripts/backup-db.sh "deploy@$SSH_HOST:/opt/taxi/scripts/"
      - name: Pull, migrate, restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          TAG: ${{ needs.build.outputs.tag }}
        # The script travels over stdin (`bash -s`), with the values expanded
        # on the runner: nothing secret lands in the box's process list.
        run: |
          ssh -i ~/.ssh/deploy "deploy@$SSH_HOST" 'bash -s' <<EOF
          set -euo pipefail
          cd /opt/taxi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export API_IMAGE_TAG="$TAG"
          compose="docker compose -f docker-compose.yml -f compose.prod.yml"
          \$compose pull api
          \$compose run --rm api node db/dist/migrate-run.js
          \$compose up -d --wait
          # Record what is running, so a by-hand \`up\` on the box later starts
          # the same image and a rollback is one edit of this line.
          if grep -q '^API_IMAGE_TAG=' .env; then
            sed -i "s/^API_IMAGE_TAG=.*/API_IMAGE_TAG=$TAG/" .env
          else
            echo "API_IMAGE_TAG=$TAG" >> .env
          fi
          docker image prune -f >/dev/null
          \$compose ps
          EOF
      - name: Health from the outside
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        # A repo VARIABLE, not a secret — it is a public hostname. Skipped
        # until it is set, so the first run can finish before DNS exists.
        run: |
          if [ -z "$API_DOMAIN" ]; then echo "API_DOMAIN not set; skipping"; exit 0; fi
          curl -fsS --max-time 15 "https://$API_DOMAIN/health"

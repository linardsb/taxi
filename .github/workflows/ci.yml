name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual escape hatch. PR events are the only way a branch gets tested here,
  # and when one silently fails to fire there is otherwise nothing to pull —
  # #52 sat with zero check runs on its head commit and neither a push nor a
  # close/reopen produced a run. GitHub only offers this trigger for workflows
  # on the default branch, and dispatching against a ref needs the file present
  # on that ref too, so a branch cut before this merged still cannot use it.
  workflow_dispatch:

# One run per PR head. A green run for an OLD head must not flip a PR whose
# NEW head is still being tested (#165); cancelling the old run also stops it
# spending minutes on a tree nobody will merge. Pushes to main are never
# cancelled: each is a merge that should get its own baseline.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Postgres comes up from docker-compose via the api's `pretest`. Redis does
    # not: the suites that need it are opt-in behind REDIS_TEST_URL, because
    # 6379/6380 are taken on the primary dev machine. Unset, they describe.skip
    # — so CI was silently running five fewer tests than the local gate, and the
    # Redis KV store's atomicity had no coverage at all.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Already in turbo.json's globalEnv, so strict env mode passes it to the
      # test task and it lands in the cache key.
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The service's health check runs INSIDE the container, so it passes even
      # if the host port mapping is wrong — and a Redis the suites can't reach
      # is a silent skip, not a red build. Fail here instead.
      - name: Verify Redis is reachable from the runner
        run: node -e "require('net').connect(6379,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',(e)=>{console.error(e.message);process.exit(1)})"
      - run: pnpm turbo run typecheck lint test build

  # No new advisories (#165). The backlog rides (66 advisory ids at 6d72261,
  # observed 2026-09-10: 2 critical, 46 high, 17 moderate, 1 low); a PR may not
  # grow it. Those are the `.advisories` map this gate diffs. pnpm ALSO reports
  # `metadata.vulnerabilities` — 2/47/18/1, summing to 68 — which counts
  # something else; do not mix the two (#165, PR #167 review F9).
  # Base = the target branch's tip, audited from its lockfile alone; head =
  # the PR merge ref actions/checkout gives us, i.e. what would land.
  audit-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # The checkout is depth-1 on the merge ref; without this fetch the base
      # ref does not exist in the runner's clone.
      - run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - run: .github/scripts/audit-diff.sh "origin/${GITHUB_BASE_REF}"

  # CodeQL (#165). The repo went public on 2026-09-10 so code scanning is
  # free; a private repo needs a Code Security licence and the CodeQL CLI
  # licence forbids CI use on private code without one. The upload gives the
  # alerts tab and the PR annotations. The GATE is codeql-gate.sh: it reads
  # the alerts GitHub produced from this upload and fails when the PR adds a
  # high/critical (or error-level) alert the base does not carry, the same
  # diff rule as audit-diff. The "Code scanning results" check GitHub adds on
  # its own is a check run outside this workflow, which `ready.needs` cannot
  # see. Default setup must stay off: GitHub rejects an advanced-setup SARIF
  # while default setup is on. On push to main this job is the baseline the
  # PR gate diffs against; the gate step itself is PR-only.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF; also reads the alerts
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          # The default suite asks 87 rules and has answered 0 on every run
          # (#187). `security-extended` adds lower-precision security queries;
          # NOT `security-and-quality`, whose maintainability rules are not
          # security findings and would still block a PR through this gate's
          # `rule.severity == "error"` branch.
          queries: security-extended
          # `app`/`backend` are the fenced anketa mini-project (CLAUDE.md): a
          # session may not edit them, so a finding there could never be fixed
          # by the loop that reads it. The rest are build outputs.
          config: |
            paths-ignore:
              - app
              - backend
              - '**/dist'
              - '**/.next'
              - '**/.expo'
              - '**/coverage'
      - uses: github/codeql-action/analyze@v4
        with:
          upload: always
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/codeql-gate.sh --pr "$PR" --base "$GITHUB_BASE_REF"

  # The only path from draft to ready (#165). The hook refuses that flip in a
  # Claude session, but it does so by matching TEXT — a Bash command's text,
  # and the text a write tool would put into a NON-`.md` file — so it makes
  # the flip deliberate rather than convenient and cannot make it impossible:
  # writing the command into a script and running the script matches no
  # pattern, and the `.md` exemption is a deliberate escape hatch
  # (`.claude/hooks/pre_tool_use.py:25-30`, `:218-224`). The control that
  # holds is branch protection on `main`, runbook §5 (#165, PR #167 review
  # F4/F5, #175 M3). The GitHub UI button is the documented human bypass
  # (docs/runbooks/pr-gate.md §1). Red anywhere in
  # `needs` converts the PR back to a draft. `!cancelled()` rather than
  # `always()`: a cancelled run must not touch the PR; the run that cancelled
  # it will.
  #
  # What ready therefore means, exactly: THE HEAD CI LAST FINISHED TESTING
  # PASSED — not "the PR's current head passed". Between a push and that head's
  # run reaching this job (about 3.5 min, the `check` job dominating) the PR
  # keeps whatever state the previous head earned. Nothing re-drafts on
  # `synchronize`, by choice: the runbook's human bypass is a person clicking
  # Ready for review, and a job that re-drafted every push would silently undo
  # it before any gate result existed. The window closes properly with required
  # status checks on main (`strict: true`), not here (#165, PR #167 review F3).
  #
  # The token is a CLASSIC `repo`-scope PAT in the PR_READY_TOKEN secret, not
  # github.token and not a fine-grained PAT: the draft↔ready mutations refuse
  # both (observed on PR #167, 2026-09-10: "Resource not accessible by
  # integration" with github.token under `pull-requests: write`, run
  # 34471269249; "Resource not accessible by personal access token" with a
  # fine-grained token, run 34472223208; the classic token flipped it). A
  # missing secret fails this job, so the PR stays a draft: fail closed. A PAT's events CAN start workflows,
  # unlike github.token's, but `ready_for_review` and `converted_to_draft`
  # are not in `pull_request`'s default activity types, so no run follows.
  ready:
    needs: [check, audit-diff, codeql]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PR_READY_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      RESULTS: ${{ join(needs.*.result, ' ') }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # A stale re-run must not decide a newer head's draft state. `gh run
      # rerun` on an older run — the runbook's own remedy in §1 — replays the
      # ORIGINAL event payload, so it re-tests the old head's merge commit,
      # joins concurrency group ci-N, cancels the live run for the new head,
      # and would then flip the PR at a head it never tested (#165, PR #167
      # review F3c). Compare and refuse; the newer head's own run decides.
      - name: Refuse to act on a head that is no longer the PR's
        run: |
          live=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "::error::this run tested $HEAD_SHA but PR #$PR is now at $live; leaving its draft state alone (#165)."
            exit 1
          fi
          echo "head confirmed: $HEAD_SHA"
      - run: |
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*)
              gh pr ready --undo --repo "$GITHUB_REPOSITORY" "$PR"
              echo "::error::gate results: $RESULTS. PR #$PR stays a draft (#165)."
              exit 1 ;;
            *)
              gh pr ready --repo "$GITHUB_REPOSITORY" "$PR" ;;
          esac
